# fly.toml app configuration file generated for church-intercessory-system on 2026-09-26T22:29:05Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'church-intercessory-system'
primary_region = 'iad'

[build]

[env]
  PORT = '8080'
  # SQLite lives on the persistent volume below. Without this, every restart/deploy
  # wipes the database and all accounts with it.
  DATABASE_PATH = '/data/erc_masoro.sqlite3'

[mounts]
  source = 'erc_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
